<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ marca_nombre or "Agendar una cita" }}</title>
<style>
  :root {
    color-scheme: light;
    --acento: {{ color_acento }};
    --acento-texto: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f4f6; color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  .pagina { max-width: 520px; margin: 0 auto; }
  .marca {
    display: flex; align-items: center; gap: 10px;
    margin: 0 4px 16px;
  }
  .marca-logo {
    width: 40px; height: 40px; border-radius: 10px; object-fit: contain;
    background: #fff; border: 1px solid #e5e5e8; padding: 4px;
  }
  .marca-nombre { font-size: .88rem; font-weight: 600; color: #52525b; }
  .tarjeta {
    background: #fff; border-radius: 16px;
    padding: 28px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  h1 { font-size: 1.35rem; margin: 0 0 6px; line-height: 1.25; }
  p.descripcion { color: #555; margin: 0 0 18px; font-size: .92rem; line-height: 1.5; }
  .duracion {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f4f4f6; color: #3f3f46; font-size: .78rem; font-weight: 600;
    padding: 5px 12px; border-radius: 999px; margin-bottom: 20px;
  }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; color: #27272a; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: .95rem; font-family: inherit; color: #1a1a1a;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--acento);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 18%, transparent);
  }
  .dias { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-top: 8px; }
  .dia-btn {
    flex: 0 0 auto; padding: 9px 14px; border: 1px solid #e4e4e7; border-radius: 10px;
    background: #fff; cursor: pointer; font-size: .85rem; white-space: nowrap;
    transition: border-color .15s, background .15s;
  }
  .dia-btn:hover { border-color: var(--acento); }
  .dia-btn.activo { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .slot-btn {
    padding: 10px 4px; border: 1px solid #e4e4e7; border-radius: 10px; background: #fff;
    cursor: pointer; font-size: .85rem; font-weight: 500;
    transition: border-color .15s, background .15s;
  }
  .slot-btn:hover { border-color: var(--acento); }
  .slot-btn.activo { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
  .vacio { color: #777; font-size: .88rem; padding: 14px 0; }
  button.enviar {
    margin-top: 20px; width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--acento); color: var(--acento-texto); font-size: .95rem; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  button.enviar:hover { opacity: .92; }
  button.enviar:disabled { background: #a3a3a3; cursor: not-allowed; }
  .error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px;
    padding: 14px; font-size: .9rem; }
  .ok { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
    padding: 18px; font-size: .95rem; line-height: 1.5; }
  .cargando { color: #777; font-size: .85rem; padding: 10px 0; }
  .pie {
    text-align: center; margin-top: 18px; font-size: .78rem; color: #a1a1aa;
  }
</style>
</head>
<body>
<div class="pagina">
  {% if marca_logo or marca_nombre %}
  <header class="marca">
    {% if marca_logo %}<img class="marca-logo" src="{{ marca_logo }}" alt="{{ marca_nombre or "" }}">{% endif %}
    {% if marca_nombre %}<span class="marca-nombre">{{ marca_nombre }}</span>{% endif %}
  </header>
  {% endif %}

  <div class="tarjeta" id="tarjeta">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% else %}
    <div id="contenido">
      <div class="cargando">Cargando calendario…</div>
    </div>
    {% endif %}
  </div>

  <div class="pie">Agendamiento en línea</div>
</div>

{% if not error %}
<script>
(function () {
  var SLUG = {{ slug | tojson }};
  var CSRF = {{ csrf_token | tojson }};
  var contenido = document.getElementById("contenido");
  var estado = { info: null, dias: [], diaSeleccionado: null, slots: [], slotSeleccionado: null };

  function llamar(metodo, params, opts) {
    opts = opts || {};
    var qs = Object.keys(params || {})
      .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); })
      .join("&");
    var url = "/api/method/frappe_chatwoot.frappe_chatwoot.api.agenda_calendarios." + metodo;
    var fetchOpts = { headers: {} };
    if (opts.post) {
      fetchOpts.method = "POST";
      fetchOpts.headers["Content-Type"] = "application/json";
      fetchOpts.headers["X-Frappe-CSRF-Token"] = CSRF;
      fetchOpts.body = JSON.stringify(params || {});
    } else {
      url += (qs ? "?" + qs : "");
    }
    return fetch(url, fetchOpts).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) {
          var msg = (data && data._server_messages) ? data._server_messages : (data && data.exc) ? data.exc : "Error";
          throw new Error(msg);
        }
        return data.message;
      });
    });
  }

  function agruparPorDia(slots) {
    var dias = {};
    slots.forEach(function (s) {
      if (!dias[s.fecha]) dias[s.fecha] = [];
      dias[s.fecha].push(s);
    });
    return Object.keys(dias).sort().map(function (f) { return { fecha: f, slots: dias[f] }; });
  }

  function formatoFecha(f) {
    var d = new Date(f + "T00:00:00");
    return d.toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
  }

  function render() {
    if (!estado.info) return;
    var html = "";
    html += "<h1>" + estado.info.titulo + "</h1>";
    if (estado.info.descripcion) html += "<p class=\"descripcion\">" + estado.info.descripcion + "</p>";
    html += "<span class=\"duracion\">" + estado.info.duracion_minutos + " min</span>";

    if (estado.dias.length === 0) {
      html += "<div class=\"vacio\">No hay horarios disponibles en este momento.</div>";
      contenido.innerHTML = html;
      return;
    }

    html += "<div class=\"dias\" id=\"dias\"></div>";
    html += "<div class=\"slots\" id=\"slots\"></div>";
    html += "<div id=\"form-reserva\"></div>";
    contenido.innerHTML = html;

    var diasEl = document.getElementById("dias");
    estado.dias.forEach(function (d) {
      var b = document.createElement("button");
      b.className = "dia-btn" + (d.fecha === estado.diaSeleccionado ? " activo" : "");
      b.textContent = formatoFecha(d.fecha);
      b.onclick = function () { seleccionarDia(d.fecha); };
      diasEl.appendChild(b);
    });

    if (!estado.diaSeleccionado) seleccionarDia(estado.dias[0].fecha);
    else renderSlots();
  }

  function seleccionarDia(fecha) {
    estado.diaSeleccionado = fecha;
    estado.slotSeleccionado = null;
    render();
    renderSlots();
  }

  function renderSlots() {
    var slotsEl = document.getElementById("slots");
    if (!slotsEl) return;
    var dia = estado.dias.filter(function (d) { return d.fecha === estado.diaSeleccionado; })[0];
    slotsEl.innerHTML = "";
    if (!dia || dia.slots.length === 0) {
      slotsEl.innerHTML = "<div class=\"vacio\">Sin horarios ese día.</div>";
      return;
    }
    dia.slots.forEach(function (s) {
      var b = document.createElement("button");
      b.className = "slot-btn" + (s.inicio === estado.slotSeleccionado ? " activo" : "");
      b.textContent = s.hora_inicio;
      b.onclick = function () {
        estado.slotSeleccionado = s.inicio;
        renderSlots();
        renderFormulario();
      };
      slotsEl.appendChild(b);
    });
    renderFormulario();
  }

  function renderFormulario() {
    var el = document.getElementById("form-reserva");
    if (!el) return;
    if (!estado.slotSeleccionado) { el.innerHTML = ""; return; }
    el.innerHTML =
      "<label>Nombre</label><input id=\"f-nombre\" type=\"text\" placeholder=\"Tu nombre\">" +
      "<label>Teléfono</label><input id=\"f-telefono\" type=\"tel\" placeholder=\"WhatsApp o teléfono\">" +
      "<label>Correo (opcional)</label><input id=\"f-email\" type=\"email\" placeholder=\"tu@correo.com\">" +
      "<label>Notas (opcional)</label><textarea id=\"f-notas\" rows=\"2\"></textarea>" +
      "<button class=\"enviar\" id=\"btn-reservar\">Confirmar cita</button>" +
      "<div id=\"form-msg\"></div>";
    document.getElementById("btn-reservar").onclick = reservar;
  }

  function reservar() {
    var btn = document.getElementById("btn-reservar");
    var msg = document.getElementById("form-msg");
    var nombre = document.getElementById("f-nombre").value.trim();
    var telefono = document.getElementById("f-telefono").value.trim();
    var email = document.getElementById("f-email").value.trim();
    var notas = document.getElementById("f-notas").value.trim();

    if (!nombre) { msg.innerHTML = "<div class=\"error\">Falta el nombre.</div>"; return; }
    if (!telefono && !email) { msg.innerHTML = "<div class=\"error\">Deja un teléfono o un correo.</div>"; return; }

    btn.disabled = true;
    msg.innerHTML = "<div class=\"cargando\">Reservando…</div>";

    llamar("reservar", {
      slug: SLUG, slot_inicio: estado.slotSeleccionado,
      nombre: nombre, telefono: telefono, email: email, notas: notas,
    }, { post: true }).then(function () {
      contenido.innerHTML = "<div class=\"ok\">Listo — tu cita quedó agendada. Te contactaremos para confirmar los detalles.</div>";
    }).catch(function (e) {
      btn.disabled = false;
      msg.innerHTML = "<div class=\"error\">No se pudo reservar: " + e.message + "</div>";
      // El slot pudo dejar de estar libre entre que se mostró y se confirmó —
      // se refresca la disponibilidad para que el visitante elija otro.
      cargarSlots();
    });
  }

  function cargarSlots() {
    return llamar("slots", { slug: SLUG }).then(function (data) {
      estado.dias = agruparPorDia(data.slots || []);
      estado.diaSeleccionado = null;
      estado.slotSeleccionado = null;
      render();
    });
  }

  llamar("calendario_info", { slug: SLUG }).then(function (info) {
    estado.info = info;
    return cargarSlots();
  }).catch(function (e) {
    contenido.innerHTML = "<div class=\"error\">No se pudo cargar el calendario: " + e.message + "</div>";
  });
})();
</script>
{% endif %}
</body>
</html>
